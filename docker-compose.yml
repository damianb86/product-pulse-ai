name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the app .env}

services:
  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in ../shared-docker/.env}
      APP_DB_NAME: ${APP_DB_NAME:?Set APP_DB_NAME in the app .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in the app .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the app .env}
    volumes:
      - ./docker/app/init-db.sh:/init-db.sh:ro
    command: ["/bin/sh", "/init-db.sh"]
    networks:
      - shared_apps

  app:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      APP_ENV: production
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS}
      PORT: 3000
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:?Set SHOPIFY_API_KEY in the app .env}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:?Set SHOPIFY_API_SECRET in the app .env}
      SCOPES: ${SCOPES:?Set SCOPES in the app .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the app .env}
      SHOPIFY_APP_URL: ${PROD_SHOPIFY_APP_URL:?Set PROD_SHOPIFY_APP_URL in the app .env}
      SHOPIFY_ADMIN_APP_HANDLE: ${SHOPIFY_ADMIN_APP_HANDLE:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      PRODUCT_PULSE_BETA_FEEDBACK_ENABLED: ${PRODUCT_PULSE_BETA_FEEDBACK_ENABLED:-}
      BETA_FEEDBACK_ENABLED: ${BETA_FEEDBACK_ENABLED:-}
      BETA_FEEDBACK_RECIPIENT: ${BETA_FEEDBACK_RECIPIENT:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the app .env}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:-}
      PRODUCT_PULSE_OPENAI_BATCH_ENABLED: ${PRODUCT_PULSE_OPENAI_BATCH_ENABLED:-}
      PRODUCT_PULSE_AI_LEVEL: ${PRODUCT_PULSE_AI_LEVEL:-3}
      OPENAI_BASIC_MODEL: ${OPENAI_BASIC_MODEL:-gpt-5.4-nano}
      OPENAI_PRO_MODEL: ${OPENAI_PRO_MODEL:-gpt-5.4-mini}
      OPENAI_PREMIUM_MODEL: ${OPENAI_PREMIUM_MODEL:-gpt-5.4}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_FALLBACK_POOL: ${GEMINI_MODEL_FALLBACK_POOL:-}
      AI_SCOPE_GUARD_ENABLED: ${AI_SCOPE_GUARD_ENABLED:-false}
      AI_OUTPUT_GUARD_ENABLED: ${AI_OUTPUT_GUARD_ENABLED:-true}
      AI_SCOPE_GUARD_MODEL: ${AI_SCOPE_GUARD_MODEL:-gpt-5.4-nano}
      AI_SCOPE_GUARD_MAX_OUTPUT_TOKENS: ${AI_SCOPE_GUARD_MAX_OUTPUT_TOKENS:-700}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-5.4-mini}
      AI_CHAT_CHEAP_MODEL: ${AI_CHAT_CHEAP_MODEL:-gpt-5.4-nano}
      AI_CHAT_STANDARD_MONTHLY_MESSAGE_LIMIT: ${AI_CHAT_STANDARD_MONTHLY_MESSAGE_LIMIT:-30}
      AI_CHAT_CHEAP_MONTHLY_MESSAGE_LIMIT: ${AI_CHAT_CHEAP_MONTHLY_MESSAGE_LIMIT:-100}
      AI_CHATKIT_ENABLED: ${AI_CHATKIT_ENABLED:-true}
      AI_CHATKIT_API_URL: ${AI_CHATKIT_API_URL:-/api/ai/chatkit/message}
      AI_CHATKIT_DOMAIN_KEY: ${AI_CHATKIT_DOMAIN_KEY:?Set AI_CHATKIT_DOMAIN_KEY in the app .env}
      PRODUCT_PULSE_WATCHLIST_CRON_SECRET: ${PRODUCT_PULSE_WATCHLIST_CRON_SECRET:?Set PRODUCT_PULSE_WATCHLIST_CRON_SECRET in the app .env}
      PRODUCT_PULSE_INLINE_WORKERS_ENABLED: ${PRODUCT_PULSE_INLINE_WORKERS_ENABLED:-false}
      PRODUCT_PULSE_JOB_LEASE_TTL_MS: ${PRODUCT_PULSE_JOB_LEASE_TTL_MS:-600000}
      PRODUCT_PULSE_JOB_HEARTBEAT_MS: ${PRODUCT_PULSE_JOB_HEARTBEAT_MS:-60000}
      PRODUCT_PULSE_WORKER_IDLE_SLEEP_MS: ${PRODUCT_PULSE_WORKER_IDLE_SLEEP_MS:-5000}
      PRODUCT_PULSE_WORKER_MAX_JOBS_PER_CYCLE: ${PRODUCT_PULSE_WORKER_MAX_JOBS_PER_CYCLE:-1}
      PRODUCT_PULSE_QUICK_SCAN_MINIMUM_DURATION_MS: ${PRODUCT_PULSE_QUICK_SCAN_MINIMUM_DURATION_MS:-0}
      PRODUCT_PULSE_QUICK_SCAN_EXTRACTION_MODE: ${PRODUCT_PULSE_QUICK_SCAN_EXTRACTION_MODE:-auto}
      PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_PRODUCT_LIMIT: ${PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_PRODUCT_LIMIT:-250}
      PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_ORDER_LIMIT: ${PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_ORDER_LIMIT:-150}
      PRODUCT_PULSE_QUICK_SCAN_BULK_POLL_INTERVAL_MS: ${PRODUCT_PULSE_QUICK_SCAN_BULK_POLL_INTERVAL_MS:-1000}
      PRODUCT_PULSE_QUICK_SCAN_PRODUCT_COUNT_TIMEOUT_MS: ${PRODUCT_PULSE_QUICK_SCAN_PRODUCT_COUNT_TIMEOUT_MS:-2500}
      PRODUCT_PULSE_QUICK_SCAN_ORDER_COUNT_TIMEOUT_MS: ${PRODUCT_PULSE_QUICK_SCAN_ORDER_COUNT_TIMEOUT_MS:-2500}
      PRODUCT_PULSE_QUICK_SCAN_PROGRESS_LOG_INTERVAL_MS: ${PRODUCT_PULSE_QUICK_SCAN_PROGRESS_LOG_INTERVAL_MS:-5000}
      PRODUCT_PULSE_QUICK_SCAN_MAX_PAGINATED_PAGES: ${PRODUCT_PULSE_QUICK_SCAN_MAX_PAGINATED_PAGES:-1000}
      PRODUCT_PULSE_QUICK_SCAN_REFUND_BROAD_SCAN_ENABLED: ${PRODUCT_PULSE_QUICK_SCAN_REFUND_BROAD_SCAN_ENABLED:-true}
      PRODUCT_PULSE_SHOPIFY_SOURCE_CACHE_FRESH_MS: ${PRODUCT_PULSE_SHOPIFY_SOURCE_CACHE_FRESH_MS:-600000}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_PAGES: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_PAGES:-0}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDERS_PAGE_SIZE: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDERS_PAGE_SIZE:-25}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_SKUS: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_SKUS:-20}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_LINE_ITEMS_PAGE_SIZE: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_LINE_ITEMS_PAGE_SIZE:-100}
    labels:
      observability.stack: zuam
      observability.app: product-pulse-ai
      observability.service: app
      caddy: ${APP_HOST:?Set APP_HOST in the app .env}
      caddy.encode: zstd gzip
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_ingress_network: ${SHARED_DOCKER_NETWORK:-shared_apps}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - shared_apps

  worker:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    command: ["npm", "run", "docker-worker"]
    environment:
      APP_ENV: production
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:?Set SHOPIFY_API_KEY in the app .env}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:?Set SHOPIFY_API_SECRET in the app .env}
      SCOPES: ${SCOPES:?Set SCOPES in the app .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the app .env}
      SHOPIFY_APP_URL: ${PROD_SHOPIFY_APP_URL:?Set PROD_SHOPIFY_APP_URL in the app .env}
      SHOPIFY_ADMIN_APP_HANDLE: ${SHOPIFY_ADMIN_APP_HANDLE:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the app .env}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:-}
      PRODUCT_PULSE_OPENAI_BATCH_ENABLED: ${PRODUCT_PULSE_OPENAI_BATCH_ENABLED:-}
      PRODUCT_PULSE_AI_LEVEL: ${PRODUCT_PULSE_AI_LEVEL:-3}
      OPENAI_BASIC_MODEL: ${OPENAI_BASIC_MODEL:-gpt-5.4-nano}
      OPENAI_PRO_MODEL: ${OPENAI_PRO_MODEL:-gpt-5.4-mini}
      OPENAI_PREMIUM_MODEL: ${OPENAI_PREMIUM_MODEL:-gpt-5.4}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_FALLBACK_POOL: ${GEMINI_MODEL_FALLBACK_POOL:-}
      AI_SCOPE_GUARD_ENABLED: ${AI_SCOPE_GUARD_ENABLED:-false}
      AI_OUTPUT_GUARD_ENABLED: ${AI_OUTPUT_GUARD_ENABLED:-true}
      AI_SCOPE_GUARD_MODEL: ${AI_SCOPE_GUARD_MODEL:-gpt-5.4-nano}
      AI_SCOPE_GUARD_MAX_OUTPUT_TOKENS: ${AI_SCOPE_GUARD_MAX_OUTPUT_TOKENS:-700}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-5.4-mini}
      AI_CHAT_CHEAP_MODEL: ${AI_CHAT_CHEAP_MODEL:-gpt-5.4-nano}
      AI_CHAT_STANDARD_MONTHLY_MESSAGE_LIMIT: ${AI_CHAT_STANDARD_MONTHLY_MESSAGE_LIMIT:-30}
      AI_CHAT_CHEAP_MONTHLY_MESSAGE_LIMIT: ${AI_CHAT_CHEAP_MONTHLY_MESSAGE_LIMIT:-100}
      AI_CHATKIT_ENABLED: ${AI_CHATKIT_ENABLED:-true}
      AI_CHATKIT_API_URL: ${AI_CHATKIT_API_URL:-/api/ai/chatkit/message}
      AI_CHATKIT_DOMAIN_KEY: ${AI_CHATKIT_DOMAIN_KEY:?Set AI_CHATKIT_DOMAIN_KEY in the app .env}
      PRODUCT_PULSE_WATCHLIST_CRON_SECRET: ${PRODUCT_PULSE_WATCHLIST_CRON_SECRET:?Set PRODUCT_PULSE_WATCHLIST_CRON_SECRET in the app .env}
      PRODUCT_PULSE_INLINE_WORKERS_ENABLED: "true"
      PRODUCT_PULSE_JOB_LEASE_TTL_MS: ${PRODUCT_PULSE_JOB_LEASE_TTL_MS:-600000}
      PRODUCT_PULSE_JOB_HEARTBEAT_MS: ${PRODUCT_PULSE_JOB_HEARTBEAT_MS:-60000}
      PRODUCT_PULSE_WORKER_IDLE_SLEEP_MS: ${PRODUCT_PULSE_WORKER_IDLE_SLEEP_MS:-5000}
      PRODUCT_PULSE_WORKER_MAX_JOBS_PER_CYCLE: ${PRODUCT_PULSE_WORKER_MAX_JOBS_PER_CYCLE:-1}
      PRODUCT_PULSE_QUICK_SCAN_MINIMUM_DURATION_MS: ${PRODUCT_PULSE_QUICK_SCAN_MINIMUM_DURATION_MS:-0}
      PRODUCT_PULSE_QUICK_SCAN_EXTRACTION_MODE: ${PRODUCT_PULSE_QUICK_SCAN_EXTRACTION_MODE:-auto}
      PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_PRODUCT_LIMIT: ${PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_PRODUCT_LIMIT:-250}
      PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_ORDER_LIMIT: ${PRODUCT_PULSE_QUICK_SCAN_PAGINATED_AUTO_ORDER_LIMIT:-150}
      PRODUCT_PULSE_QUICK_SCAN_BULK_POLL_INTERVAL_MS: ${PRODUCT_PULSE_QUICK_SCAN_BULK_POLL_INTERVAL_MS:-1000}
      PRODUCT_PULSE_QUICK_SCAN_PRODUCT_COUNT_TIMEOUT_MS: ${PRODUCT_PULSE_QUICK_SCAN_PRODUCT_COUNT_TIMEOUT_MS:-2500}
      PRODUCT_PULSE_QUICK_SCAN_ORDER_COUNT_TIMEOUT_MS: ${PRODUCT_PULSE_QUICK_SCAN_ORDER_COUNT_TIMEOUT_MS:-2500}
      PRODUCT_PULSE_QUICK_SCAN_PROGRESS_LOG_INTERVAL_MS: ${PRODUCT_PULSE_QUICK_SCAN_PROGRESS_LOG_INTERVAL_MS:-5000}
      PRODUCT_PULSE_QUICK_SCAN_MAX_PAGINATED_PAGES: ${PRODUCT_PULSE_QUICK_SCAN_MAX_PAGINATED_PAGES:-1000}
      PRODUCT_PULSE_QUICK_SCAN_REFUND_BROAD_SCAN_ENABLED: ${PRODUCT_PULSE_QUICK_SCAN_REFUND_BROAD_SCAN_ENABLED:-true}
      PRODUCT_PULSE_SHOPIFY_SOURCE_CACHE_FRESH_MS: ${PRODUCT_PULSE_SHOPIFY_SOURCE_CACHE_FRESH_MS:-600000}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_PAGES: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_PAGES:-0}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDERS_PAGE_SIZE: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDERS_PAGE_SIZE:-25}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_SKUS: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_MAX_SKUS:-20}
      PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_LINE_ITEMS_PAGE_SIZE: ${PRODUCT_PULSE_DIAGNOSIS_TARGETED_ORDER_LINE_ITEMS_PAGE_SIZE:-100}
    labels:
      observability.stack: zuam
      observability.app: product-pulse-ai
      observability.service: worker
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - shared_apps

networks:
  shared_apps:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-shared_apps}
