name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the app .env}

services:
  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in ../shared-docker/.env}
      APP_DB_NAME: ${APP_DB_NAME:?Set APP_DB_NAME in the app .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in the app .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the app .env}
    volumes:
      - ./docker/app/init-db.sh:/init-db.sh:ro
    command: ["/bin/sh", "/init-db.sh"]
    networks:
      - shared_apps

  app:
    build: .
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS}
      PORT: 3000
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:?Set SHOPIFY_API_KEY in the app .env}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:?Set SHOPIFY_API_SECRET in the app .env}
      SCOPES: ${SCOPES:?Set SCOPES in the app .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the app .env}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:?Set SHOPIFY_APP_URL in the app .env}
      SHOPIFY_ADMIN_APP_HANDLE: ${SHOPIFY_ADMIN_APP_HANDLE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the app .env}
      PRODUCT_PULSE_AI_LEVEL: ${PRODUCT_PULSE_AI_LEVEL:-3}
      OPENAI_BASIC_MODEL: ${OPENAI_BASIC_MODEL:-gpt-5.4-nano}
      OPENAI_PRO_MODEL: ${OPENAI_PRO_MODEL:-gpt-5.4-mini}
      OPENAI_PREMIUM_MODEL: ${OPENAI_PREMIUM_MODEL:-gpt-5.4}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_FALLBACK_POOL: ${GEMINI_MODEL_FALLBACK_POOL:-}
      PRODUCT_PULSE_CHAT_MESSAGES_PER_POINT: ${PRODUCT_PULSE_CHAT_MESSAGES_PER_POINT:-10}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-5.4-mini}
      AI_CHATKIT_ENABLED: ${AI_CHATKIT_ENABLED:-true}
      AI_CHATKIT_API_URL: ${AI_CHATKIT_API_URL:-/api/ai/chatkit/message}
      AI_CHATKIT_DOMAIN_KEY: ${AI_CHATKIT_DOMAIN_KEY:?Set AI_CHATKIT_DOMAIN_KEY in the app .env}
    labels:
      caddy: ${APP_HOST:?Set APP_HOST in the app .env}
      caddy.encode: zstd gzip
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_ingress_network: ${SHARED_DOCKER_NETWORK:-shared_apps}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - shared_apps

networks:
  shared_apps:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-shared_apps}
