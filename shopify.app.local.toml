# Localhost-only Shopify CLI config.
# Webhook subscriptions are intentionally omitted because Shopify cannot invoke localhost URLs.

client_id = "803894d3814cf8d9c9c99a345287b472"
name = "Product Pulse IA"
application_url = "https://app-ppa.zuam.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = false

[webhooks]
api_version = "2026-07"

[access_scopes]
scopes = "read_products,write_products,read_orders,read_all_orders,read_customers,read_returns,read_inventory,read_locations"

[auth]
redirect_urls = [ "https://app-ppa.zuam.dev/auth/callback" ]
